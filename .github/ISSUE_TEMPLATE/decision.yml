name: 🧭 Decision proposal
description: Propose or record an architecture decision
title: "Decision: "
labels: ["type:decision", "needs-decision"]
body:
  - type: markdown
    attributes:
      value: |
        A decision becomes a record in `docs/adr/` after it is accepted. State the problem and the options here. See [docs/adr/README.md](https://github.com/l2go/l2jfree/blob/main/docs/adr/README.md).
  - type: textarea
    id: context
    attributes:
      label: 📌 Context
      description: The problem, the constraints, and what is already decided.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: ⚖️ Options
      description: Each option with its cost and its risk.
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: 👍 Recommendation
      description: The option you suggest and why.
  - type: textarea
    id: revisit
    attributes:
      label: 🔁 Revisit when
      description: The condition that would reopen the decision.
