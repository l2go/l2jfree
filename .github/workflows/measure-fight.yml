name: measure-fight

# Measurement branch only, not for main. A fighter attacks a monster while N watchers stand in the same place; the
# server logs, per five seconds, how long world tasks ran and how much of that was packet broadcast.

on:
  push:
    branches: ["measure/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Set up Microsoft Build of OpenJDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: "25"
          cache: maven

      - name: Package without tests
        run: ./mvnw -B -ntp -DskipTests -Dl2jfree.build.revision=${{ github.sha }} install

      - name: Stage the image context
        run: |
          version="$(./mvnw -q -N org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=project.version -DforceStdout)"
          mkdir -p dist
          cp "engine/java/smoke/target/l2jfree-smoke-${version}.jar" dist/l2jfree-smoke.jar
          unzip -q engine/java/platform/target/l2jfree-platform-*-dist.zip -d deploy/image

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: deploy/image
          platforms: linux/amd64
          load: true
          tags: l2jfree:ci

      - name: Raise the accept limits of the stack for the load
        run: |
          docker volume create l2jfree_config
          docker run --rm --entrypoint bash -v l2jfree_config:/var/lib/l2jfree/config l2jfree:ci -c '
            for file in server loginserver; do
              printf "AcceptWarn = 1000\nAcceptReject = 2000\nAcceptWarnLong = 3000\nAcceptRejectLong = 6000\n" \
                > "/var/lib/l2jfree/config/$file.properties"
            done'

      - name: Start the stack
        env:
          L2JFREE_IMAGE: l2jfree:ci
        run: docker compose -f deploy/compose.yaml up -d --wait --wait-timeout 600

      - name: Fight with watchers around
        env:
          L2JFREE_IMAGE: l2jfree:ci
        run: |
          mkdir -p out
          smoke() { java $PROPS -jar dist/l2jfree-smoke.jar --host 127.0.0.1 --timeout-seconds 240 "$@"; }
          for watchers in 0 10 50 150; do
            start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "== $watchers watchers, from $start"
            if [ "$watchers" -gt 0 ]; then
              PROPS="-Dsmoke.hold.seconds=100" smoke --sessions "$watchers" --parallel 25 > "out/watchers-$watchers.txt" 2>&1 &
              watchers_pid=$!
              sleep 30
            fi
            PROPS="-Dsmoke.fight=true -Dsmoke.hold.seconds=60" smoke | tee "out/fighter-$watchers.txt" || true
            if [ "$watchers" -gt 0 ]; then wait "$watchers_pid" || true; fi
            docker compose -f deploy/compose.yaml logs --no-color --since "$start" server | grep -E "WorldTimings|MEASURE" > "out/timings-$watchers.txt" || true
            echo "-- timings with $watchers watchers"; cat "out/timings-$watchers.txt"
          done
          docker compose -f deploy/compose.yaml logs --no-color server > out/server.log

      - name: Keep the measurement
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fight-measurement
          path: out/*
          if-no-files-found: warn
