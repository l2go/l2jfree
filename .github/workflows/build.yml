name: build

# Microsoft OpenJDK 25 is the only build and release JDK.
# Windows 10 runtime compatibility still requires qualification on the target host.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # Build metadata and version info need only the checked out commit.
          fetch-depth: 1

      - name: Set up Microsoft Build of OpenJDK 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "25"
          cache: maven

      # Test modernization is a separate phase. This phase verifies production
      # compilation, packaging, provenance, and archive contents only.
      - name: Build and package with Java 25 while recording JFR
        run: >-
          ./mvnw -B -ntp -Dmaven.test.skip=true
          -Dl2jfree.build.revision=${{ github.sha }}
          "-Djfr.argLine=-XX:StartFlightRecording=filename=target/l2jfree-ci.jfr,settings=profile,dumponexit=true"
          install

      - name: Upload baseline JFR recordings
        uses: actions/upload-artifact@v4
        with:
          name: l2jfree-jfr-baseline
          if-no-files-found: warn
          path: "**/target/l2jfree-ci.jfr"

      - name: Generate aggregate CycloneDX SBOM
        run: ./mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.2:makeAggregateBom

      - name: Verify release distributions exclude the removed ORM stack
        shell: bash
        run: |
          mapfile -t archives < <(find l2jfree-login/target l2jfree-core/target l2jfree-datapack/target -maxdepth 1 -name '*-dist.zip' -print)
          if [[ ${#archives[@]} -ne 3 ]]; then
            echo "Expected three release distributions, found ${#archives[@]}"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            if unzip -Z1 "$archive" | grep -Eiq '(^|/)libs/[^/]*(spring|hibernate|cglib|ehcache|c3p0|mchange-commons|ecj)[^/]*\.jar$'; then
              echo "Release distribution contains removed persistence, ORM, or compiler libraries: $archive"
              exit 1
            fi

            entries="$(unzip -Z1 "$archive")"
            require_entry() {
              if ! grep -Fxq "$2" <<< "$entries"; then
                echo "Release distribution is missing $2: $1"
                exit 1
              fi
            }
            verify_logging_runtime() {
              local prefix="$1/libs/"
              for artifact in slf4j-api jul-to-slf4j logback-classic logback-core; do
                local count
                count="$(grep -Ec "^${prefix}${artifact}-[^/]+\.jar$" <<< "$entries" || true)"
                if [[ "$count" -ne 1 ]]; then
                  echo "Expected exactly one ${artifact} runtime jar in $archive, found $count"
                  exit 1
                fi
              done
              if grep -Eiq "^${prefix}(slf4j-jdk14|commons-logging|jcl-over-slf4j)-[^/]+\.jar$" <<< "$entries"; then
                echo "Release distribution contains a conflicting logging runtime jar: $archive"
                exit 1
              fi
            }
            case "$(basename "$archive")" in
              l2jfree-login-*-dist.zip)
                require_entry "$archive" loginserver/loginserver_launcher.bat
                require_entry "$archive" loginserver/config/loginserver.properties
                require_entry "$archive" loginserver/sql/accounts.sql
                verify_logging_runtime loginserver
                ;;
              l2jfree-core-*-dist.zip)
                require_entry "$archive" gameserver/gameserver_launcher.bat
                require_entry "$archive" gameserver/config/server.properties
                verify_logging_runtime gameserver
                ;;
              l2jfree-datapack-*-dist.zip)
                require_entry "$archive" gameserver/data/scripts.cfg
                require_entry "$archive" gameserver/sql/characters.sql
                ;;
              *)
                echo "Unexpected release distribution name: $archive"
                exit 1
                ;;
            esac
          done
          test -s target/bom.json

      - name: Scan dependency SBOM for known vulnerabilities
        uses: anchore/scan-action@v7.4.2
        with:
          sbom: target/bom.json
          fail-build: false
          output-format: json
          output-file: target/vulnerability-report.json

      - name: Verify vulnerability report
        run: test -s target/vulnerability-report.json

      - name: Collect verified release artifacts
        shell: bash
        run: |
          artifact_version="$(./mvnw -q -N org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=project.version -DforceStdout)"
          mkdir -p release-artifacts
          cp "l2jfree-login/target/l2jfree-login-${artifact_version}-dist.zip" release-artifacts/
          cp "l2jfree-datapack/target/l2jfree-datapack-${artifact_version}-dist.zip" release-artifacts/
          python3 - "l2jfree-core/target/l2jfree-core-${artifact_version}-dist.zip" \
            "l2jfree-datapack/target/l2jfree-datapack-${artifact_version}-dist.zip" \
            "release-artifacts/l2jfree-core-${artifact_version}-dist.zip" <<'PY'
          import os
          import re
          import sys
          import zipfile
          from pathlib import Path

          core_archive, datapack_archive, output_archive = map(Path, sys.argv[1:])
          expected_revision = os.environ["GITHUB_SHA"]
          scripts_root = Path("l2jfree-datapack/data/scripts")
          metadata_path = "gameserver/config/versionning/datapack-infos.properties"
          class_prefix = "gameserver/data/scripts/"

          with zipfile.ZipFile(datapack_archive) as datapack:
              metadata = datapack.read(metadata_path).decode("utf-8")
              revision_match = re.search(r"(?m)^SourceRevision=([^\r\n]+)$", metadata)
              if not revision_match or revision_match.group(1) != expected_revision:
                  raise SystemExit("Datapack source revision does not match GITHUB_SHA")

              bytecode = {
                  entry.filename: (entry, datapack.read(entry))
                  for entry in datapack.infolist()
                  if entry.filename.startswith(class_prefix) and entry.filename.endswith(".class")
              }
              if not bytecode:
                  raise SystemExit("Datapack distribution contains no compiled Java script classes")

          sources = sorted(scripts_root.rglob("*.java"))
          if not sources:
              raise SystemExit("No Java script sources were found")
          missing = []
          for source in sources:
              text = source.read_text(encoding="utf-8")
              package = re.search(r"(?m)^\s*package\s+([\w.]+)\s*;", text)
              package_path = package.group(1).replace(".", "/") + "/" if package else ""
              expected_class = f"{class_prefix}{package_path}{source.stem}.class"
              if expected_class not in bytecode:
                  missing.append(expected_class)
          if missing:
              raise SystemExit("Java script sources missing packaged bytecode:\n" + "\n".join(missing))

          output_archive.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(core_archive) as core, zipfile.ZipFile(output_archive, "w") as merged:
              bytecode_names = set(bytecode)
              for entry in core.infolist():
                  if entry.filename not in bytecode_names:
                      merged.writestr(entry, core.read(entry))
              for name, (entry, contents) in bytecode.items():
                  merged.writestr(entry, contents)

          with zipfile.ZipFile(output_archive) as merged:
              packaged = {entry.filename for entry in merged.infolist()}
              missing = sorted(set(bytecode) - packaged)
              if missing:
                  raise SystemExit("Merged GameServer archive is missing compiled classes:\n" + "\n".join(missing))
          print(f"Merged and verified {len(bytecode)} Java script classes for {expected_revision}")
          PY
          zip -r "release-artifacts/l2jfree-${artifact_version}-docs.zip" LICENSE README.md \
            docs/INFRASTRUCTURE-MODERNIZATION-VISION-2.0.md \
            docs/PLATFORM-3.0-VISION.md \
            docs/INFRASTRUCTURE-STACK.md \
            docs/DATABASE-MIGRATION-STRATEGY.md \
            docs/LOGGING-MIGRATION-PLAN.md \
            docs/OPERATIONS-RUNBOOK.md \
            docs/RELEASE-VERIFICATION.md
          unzip -Z1 "release-artifacts/l2jfree-${artifact_version}-docs.zip" | grep -Fxq docs/DATABASE-MIGRATION-STRATEGY.md
          unzip -Z1 "release-artifacts/l2jfree-${artifact_version}-docs.zip" | grep -Fxq docs/OPERATIONS-RUNBOOK.md
          unzip -Z1 "release-artifacts/l2jfree-${artifact_version}-docs.zip" | grep -Fxq docs/PLATFORM-3.0-VISION.md
          cp target/bom.json "release-artifacts/l2jfree-${artifact_version}-sbom.json"
          cp target/vulnerability-report.json "release-artifacts/l2jfree-${artifact_version}-vulnerability-report.json"

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: l2jfree-release-artifacts
          if-no-files-found: error
          path: release-artifacts/*

  windows-package:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Microsoft Build of OpenJDK 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "25"
          cache: maven

      - name: Package distributions on Windows
        run: .\mvnw.cmd -B -ntp "-Dmaven.test.skip=true" "-Dl2jfree.build.revision=$env:GITHUB_SHA" install

      - name: Verify Windows release archives
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $targetDirectories = @(
            'l2jfree-login/target',
            'l2jfree-core/target',
            'l2jfree-datapack/target'
          )
          $archives = @(
            Get-ChildItem -Path $targetDirectories -Filter '*-dist.zip' -File
          )
          if ($archives.Count -ne 3) {
            throw "Expected three Windows-built release distributions, found $($archives.Count)."
          }
          foreach ($archive in $archives) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead($archive.FullName)
            try {
              $removedRuntimeJars = @($zip.Entries | Where-Object {
                $_.FullName -match '(^|/)libs/[^/]*(spring|hibernate|cglib|ehcache|c3p0|mchange-commons|ecj)[^/]*\.jar$'
              })
              if ($removedRuntimeJars.Count -gt 0) {
                throw "Release distribution contains removed persistence or compiler libraries: $($archive.FullName)"
              }

              $entryNames = @($zip.Entries | ForEach-Object { $_.FullName })
              $requiredEntries = switch -Wildcard ($archive.Name) {
                'l2jfree-login-*-dist.zip' {
                  @('loginserver/loginserver_launcher.bat', 'loginserver/config/loginserver.properties', 'loginserver/sql/accounts.sql')
                  break
                }
                'l2jfree-core-*-dist.zip' {
                  @('gameserver/gameserver_launcher.bat', 'gameserver/config/server.properties')
                  break
                }
                'l2jfree-datapack-*-dist.zip' {
                  @('gameserver/data/scripts.cfg', 'gameserver/sql/characters.sql')
                  break
                }
                default { throw "Unexpected release distribution name: $($archive.Name)" }
              }
              foreach ($requiredEntry in $requiredEntries) {
                if ($requiredEntry -notin $entryNames) {
                  throw "Release distribution is missing ${requiredEntry}: $($archive.FullName)"
                }
              }
              if ($archive.Name -like 'l2jfree-login-*-dist.zip' -or $archive.Name -like 'l2jfree-core-*-dist.zip') {
                $runtimeRoot = if ($archive.Name -like 'l2jfree-login-*-dist.zip') { 'loginserver' } else { 'gameserver' }
                foreach ($artifact in @('slf4j-api', 'jul-to-slf4j', 'logback-classic', 'logback-core')) {
                  $runtimeJars = @($entryNames | Where-Object {
                    $_ -match "^$runtimeRoot/libs/$artifact-[^/]+\.jar$"
                  })
                  if ($runtimeJars.Count -ne 1) {
                    throw "Expected exactly one $artifact runtime jar in $($archive.FullName), found $($runtimeJars.Count)."
                  }
                }
                $conflictingLoggingJars = @($entryNames | Where-Object {
                  $_ -match "^$runtimeRoot/libs/(slf4j-jdk14|commons-logging|jcl-over-slf4j)-[^/]+\.jar$"
                })
                if ($conflictingLoggingJars.Count -gt 0) {
                  throw "Release distribution contains conflicting logging runtime jars: $($archive.FullName)"
                }
              }
            }
            finally {
              $zip.Dispose()
            }
          }

      - name: Merge and verify packaged Java scripts in Windows GameServer archive
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $datapackArchive = Get-Item 'l2jfree-datapack/target/l2jfree-datapack-*-dist.zip'
          $coreArchive = Get-Item 'l2jfree-core/target/l2jfree-core-*-dist.zip'
          $datapackZip = [System.IO.Compression.ZipFile]::OpenRead($datapackArchive.FullName)
          try {
            $metadataEntry = $datapackZip.GetEntry('gameserver/config/versionning/datapack-infos.properties')
            if ($null -eq $metadataEntry) { throw 'Datapack revision metadata is missing.' }
            $reader = [System.IO.StreamReader]::new($metadataEntry.Open())
            try { $metadata = $reader.ReadToEnd() } finally { $reader.Dispose() }
            $revisionMatch = [regex]::Match($metadata, '(?m)^SourceRevision=([^\r\n]+)$')
            if (-not $revisionMatch.Success -or $revisionMatch.Groups[1].Value -ne $env:GITHUB_SHA) {
              throw 'Datapack source revision does not match GITHUB_SHA.'
            }

            $bytecodeEntries = @($datapackZip.Entries | Where-Object {
              $_.FullName -like 'gameserver/data/scripts/*.class'
            })
            if ($bytecodeEntries.Count -eq 0) { throw 'Datapack distribution has no compiled Java script classes.' }
            $bytecodeFiles = foreach ($entry in $bytecodeEntries) {
              $inputStream = $entry.Open()
              $memoryStream = [System.IO.MemoryStream]::new()
              try {
                $inputStream.CopyTo($memoryStream)
                $classBytes = $memoryStream.ToArray()
              }
              finally { $memoryStream.Dispose(); $inputStream.Dispose() }
              [pscustomobject]@{ FullName = $entry.FullName; Bytes = $classBytes }
            }
            $bytecodeNames = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
            foreach ($entry in $bytecodeFiles) { [void]$bytecodeNames.Add($entry.FullName) }

            $javaSources = @(Get-ChildItem 'l2jfree-datapack/data/scripts' -Filter '*.java' -File -Recurse)
            if ($javaSources.Count -eq 0) { throw 'No Java script sources were found.' }
            foreach ($source in $javaSources) {
              $sourceText = [System.IO.File]::ReadAllText($source.FullName)
              $packageMatch = [regex]::Match($sourceText, '(?m)^\s*package\s+([\w.]+)\s*;')
              $packagePath = if ($packageMatch.Success) { $packageMatch.Groups[1].Value.Replace('.', '/') + '/' } else { '' }
              $expectedClass = "gameserver/data/scripts/${packagePath}$($source.BaseName).class"
              if (-not $bytecodeNames.Contains($expectedClass)) {
                throw "Java script source is missing packaged bytecode: $expectedClass"
              }
            }
          }
          finally { $datapackZip.Dispose() }

          $coreZip = [System.IO.Compression.ZipFile]::Open($coreArchive.FullName, [System.IO.Compression.ZipArchiveMode]::Update)
          try {
            foreach ($sourceEntry in $bytecodeFiles) {
              $existing = $coreZip.GetEntry($sourceEntry.FullName)
              if ($null -ne $existing) { $existing.Delete() }
              $targetEntry = $coreZip.CreateEntry($sourceEntry.FullName, [System.IO.Compression.CompressionLevel]::Optimal)
              $targetStream = $targetEntry.Open()
              try { $targetStream.Write($sourceEntry.Bytes, 0, $sourceEntry.Bytes.Length) }
              finally { $targetStream.Dispose() }
            }
          }
          finally { $coreZip.Dispose() }

          $mergedZip = [System.IO.Compression.ZipFile]::OpenRead($coreArchive.FullName)
          try {
            $mergedNames = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
            foreach ($entry in $mergedZip.Entries) { [void]$mergedNames.Add($entry.FullName) }
            foreach ($entry in $bytecodeFiles) {
              if (-not $mergedNames.Contains($entry.FullName)) {
                throw "Merged GameServer archive is missing compiled class: $($entry.FullName)"
              }
            }
          }
          finally { $mergedZip.Dispose() }
          $digest = (Get-FileHash -Path $coreArchive.FullName -Algorithm SHA256).Hash
          if ([string]::IsNullOrWhiteSpace($digest)) { throw 'Unable to checksum merged GameServer archive.' }
          Write-Host "Merged and verified $($bytecodeFiles.Count) Java script classes for $env:GITHUB_SHA; SHA256 $digest"

  # Release archives contain Java 25 bytecode built with OpenJDK 25. They are
  # portable JVM packages, not Windows-specific binaries.
  release:
    needs: [build, windows-package]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download verified CI artifacts
        uses: actions/download-artifact@v4
        with:
          name: l2jfree-release-artifacts
          path: release-artifacts

      - name: Verify release tag matches artifact version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          artifact_version="${release_version}"
          test -s "release-artifacts/l2jfree-login-${artifact_version}-dist.zip"
          test -s "release-artifacts/l2jfree-core-${artifact_version}-dist.zip"
          test -s "release-artifacts/l2jfree-datapack-${artifact_version}-dist.zip"
          test -s "release-artifacts/l2jfree-${artifact_version}-docs.zip"
          test -s "release-artifacts/l2jfree-${artifact_version}-sbom.json"
          test -s "release-artifacts/l2jfree-${artifact_version}-vulnerability-report.json"

      - name: Collect release artifacts and compute checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ( cd release-artifacts && sha256sum *.zip *.json > SHA256SUMS.txt )

      - name: Attest release artifacts
        uses: actions/attest@v4.2.1
        with:
          subject-path: release-artifacts/*

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="${{ github.ref_name }}"
          release_flags=()
          if [[ "$release_version" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${{ github.ref_name }}" release-artifacts/* "${release_flags[@]}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --notes "GPLv3 archival fork. This release advances the Java 25 infrastructure modernization while preserving the existing game protocol and datapack behavior. Portable JVM distributions, a CycloneDX SBOM, and its vulnerability scan report are generated by GitHub Actions. Use SHA256SUMS.txt to verify every published artifact."
