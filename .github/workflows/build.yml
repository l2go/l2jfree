name: build

# The pipeline of Platform 3.0. Microsoft OpenJDK 25 builds and tests the code.
# The image job builds the Linux image from the verified distributions, starts it
# with Docker Compose, probes the login port, and publishes the image from main
# (ADR-0002, ADR-0007). The release job arrives with the release package.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read


jobs:
  # Compiles every datapack Python script with the pinned Jython runtime. This checks
  # syntax and Java interop only; it does not run quests or AI.
  jython-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Microsoft Build of OpenJDK 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "25"

      - name: Download the pinned Jython 2.7.5b1 runtime
        shell: bash
        run: |
          jar="$RUNNER_TEMP/jython-standalone-2.7.5b1.jar"
          curl --fail --location --silent --show-error \
            "https://repo.maven.apache.org/maven2/org/python/jython-standalone/2.7.5b1/jython-standalone-2.7.5b1.jar" \
            --output "$jar"
          echo "0b3af15fad90dd3a887a88ee4fb9af082cb335cff19a54f5927673e328761290  $jar" | sha256sum --check -

      - name: Compile the datapack Python scripts and check Java interop
        run: >-
          java --enable-native-access=ALL-UNNAMED
          -cp "$RUNNER_TEMP/jython-standalone-2.7.5b1.jar"
          org.python.util.jython tools/ci/validate-jython-candidate.py l2jfree-datapack/data/scripts

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # Build metadata and version info need only the checked out commit.
          fetch-depth: 1

      - name: Set up Microsoft Build of OpenJDK 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "25"
          cache: maven

      # Unit tests run in this job. Tests tagged integration need MySQL and run
      # in the integration job. Surefire excludes that tag unless -Dgroups is set.
      # Record the Maven build JVM so the baseline does not depend on Surefire.
      - name: Build, test, and package with Java 25 while recording JFR
        env:
          MAVEN_OPTS: -XX:StartFlightRecording=filename=${{ github.workspace }}/jfr/maven-build.jfr,settings=profile,dumponexit=true
        run: >-
          mkdir -p jfr &&
          ./mvnw -B -ntp
          -Dl2jfree.build.revision=${{ github.sha }}
          install

      - name: Report JFR baseline size and checksum
        run: |
          recording="jfr/maven-build.jfr"
          test -s "$recording"
          stat -c '%s bytes %n' "$recording"
          sha256sum "$recording"

      - name: Upload baseline JFR recordings
        uses: actions/upload-artifact@v4
        with:
          name: l2jfree-jfr-baseline
          if-no-files-found: error
          path: jfr/*.jfr

      - name: Generate aggregate CycloneDX SBOM
        run: ./mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.2:makeAggregateBom

      - name: Verify release distributions exclude the removed ORM stack
        shell: bash
        run: |
          mapfile -t archives < <(find l2jfree-login/target l2jfree-core/target l2jfree-datapack/target -maxdepth 1 -name '*-dist.zip' -print)
          if [[ ${#archives[@]} -ne 3 ]]; then
            echo "Expected three release distributions, found ${#archives[@]}"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            if unzip -Z1 "$archive" | grep -Eiq '(^|/)libs/[^/]*(spring|hibernate|cglib|ehcache|c3p0|mchange-commons|ecj|irclib)[^/]*\.jar$'; then
              echo "Release distribution contains a removed persistence, compiler, or IRC library: $archive"
              exit 1
            fi

            entries="$(unzip -Z1 "$archive")"
            require_entry() {
              if ! grep -Fxq "$2" <<< "$entries"; then
                echo "Release distribution is missing $2: $1"
                exit 1
              fi
            }
            verify_logging_runtime() {
              local prefix="$1/libs/"
              for artifact in slf4j-api jul-to-slf4j logback-classic logback-core; do
                local count
                count="$(grep -Ec "^${prefix}${artifact}-[^/]+\.jar$" <<< "$entries" || true)"
                if [[ "$count" -ne 1 ]]; then
                  echo "Expected exactly one ${artifact} runtime jar in $archive, found $count"
                  exit 1
                fi
              done
              if grep -Eiq "^${prefix}(slf4j-jdk14|commons-logging|jcl-over-slf4j)-[^/]+\.jar$" <<< "$entries"; then
                echo "Release distribution contains a conflicting logging runtime jar: $archive"
                exit 1
              fi
            }
            case "$(basename "$archive")" in
              l2jfree-login-*-dist.zip)
                require_entry "$archive" loginserver/loginserver_launcher.bat
                require_entry "$archive" loginserver/config/loginserver.properties
                require_entry "$archive" loginserver/config/logback.xml
                require_entry "$archive" loginserver/agents/opentelemetry-javaagent.jar
                verify_logging_runtime loginserver
                ;;
              l2jfree-core-*-dist.zip)
                require_entry "$archive" gameserver/gameserver_launcher.bat
                require_entry "$archive" gameserver/config/server.properties
                require_entry "$archive" gameserver/config/logback.xml
                require_entry "$archive" gameserver/agents/opentelemetry-javaagent.jar
                verify_logging_runtime gameserver
                ;;
              l2jfree-datapack-*-dist.zip)
                require_entry "$archive" gameserver/data/scripts.cfg
                require_entry "$archive" gameserver/catalog/npc_template.csv
                ;;
              *)
                echo "Unexpected release distribution name: $archive"
                exit 1
                ;;
            esac
          done
          test -s target/bom.json

      - name: Scan dependency SBOM for known vulnerabilities
        uses: anchore/scan-action@v7.4.2
        with:
          sbom: target/bom.json
          fail-build: false
          output-format: json
          output-file: target/vulnerability-report.json

      - name: Verify vulnerability report
        run: test -s target/vulnerability-report.json

      - name: Collect the verified distributions
        shell: bash
        run: |
          version="$(./mvnw -q -N org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=project.version -DforceStdout)"
          mkdir -p dist
          cp "l2jfree-login/target/l2jfree-login-${version}-dist.zip" dist/
          cp "l2jfree-core/target/l2jfree-core-${version}-dist.zip" dist/
          cp target/bom.json "dist/l2jfree-${version}-sbom.json"
          cp target/vulnerability-report.json "dist/l2jfree-${version}-vulnerability-report.json"

      - name: Upload the verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: l2jfree-dist
          if-no-files-found: error
          path: dist/*

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Microsoft Build of OpenJDK 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "25"
          cache: maven

      - name: Run the PostgreSQL integration tests
        run: |
          ./mvnw -B -ntp \
            -Dgroups=integration \
            -Dsurefire.excludedGroups= \
            -Dl2jfree.build.revision=${{ github.sha }} \
            verify
          reports="$(find l2jfree-core/target/surefire-reports l2jfree-login/target/surefire-reports -name 'TEST-*.xml' | wc -l | tr -d '[:space:]')"
          expected="$(grep -rl '@Tag("integration")' --include='*.java' l2jfree-core/src/test l2jfree-login/src/test | wc -l | tr -d '[:space:]')"
          echo "integration reports: ${reports} of ${expected} tagged classes"
          test "${expected}" -gt 0
          test "${reports}" -ge "${expected}"

      - name: Upload what the database checks wrote
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l2jfree-database-checks
          if-no-files-found: ignore
          path: |
            l2jfree-core/target/statement-check.txt
            l2jfree-core/target/database-docs/*

  # Builds the Platform 3.0 image from the verified LoginServer distribution,
  # starts the stack with Docker Compose, and probes the login port. A push to
  # main also publishes the image, signed and attested. Images stay private
  # until the release and sha-* tags are kept for 30 days (ADR-0007).
  image:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY_IMAGE: ghcr.io/l2go/l2jfree
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download the verified distributions
        uses: actions/download-artifact@v4
        with:
          name: l2jfree-dist
          path: dist

      - name: Stage the image context
        run: |
          unzip -q dist/l2jfree-login-*-dist.zip -d deploy/image
          test -f deploy/image/loginserver/config/loginserver.properties

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: deploy/image
          load: true
          tags: l2jfree:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the image content
        run: deploy/verify-image.sh l2jfree:ci

      - name: Start the stack with Docker Compose
        env:
          L2JFREE_IMAGE: l2jfree:ci
        run: docker compose -f deploy/compose.yaml up -d --wait --wait-timeout 240

      - name: Probe the login port
        run: python3 deploy/probe/login_init.py --host 127.0.0.1 --port 2106 --timeout 60

      - name: Restart the login service and probe again
        env:
          L2JFREE_IMAGE: l2jfree:ci
        run: |
          docker compose -f deploy/compose.yaml restart login
          docker compose -f deploy/compose.yaml up -d --wait --wait-timeout 120
          python3 deploy/probe/login_init.py --host 127.0.0.1 --port 2106 --timeout 60

      - name: Show the service logs after a failure
        if: failure()
        env:
          L2JFREE_IMAGE: l2jfree:ci
        run: docker compose -f deploy/compose.yaml logs --no-color --tail 200 || true

      - name: Stop the stack
        if: always()
        env:
          L2JFREE_IMAGE: l2jfree:ci
        run: docker compose -f deploy/compose.yaml down -v || true

      - name: Name the commit tag
        id: names
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the image
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: deploy/image
          push: true
          tags: |
            ${{ env.REGISTRY_IMAGE }}:edge
            ${{ env.REGISTRY_IMAGE }}:sha-${{ steps.names.outputs.short }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - name: Install cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3

      - name: Sign the image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cosign sign --yes "${REGISTRY_IMAGE}@${{ steps.push.outputs.digest }}"

      - name: Attest the build provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@v4.2.1
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
