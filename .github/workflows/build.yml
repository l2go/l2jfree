name: build

# Build compatibility matrix for the 2026 Q4 Windows 10 upgrade. JDK 11 is
# retained as a transition baseline; JDK 25 is the new build and release JDK.
# Windows 10 runtime compatibility still requires qualification on a real host.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "25"]
    steps:
      - uses: actions/checkout@v5
        with:
          # maven-jgit-buildnumber-plugin reads git history; a shallow clone
          # produces a wrong/missing build number, not a build failure, but
          # full history keeps the number meaningful.
          fetch-depth: 0

      - name: Set up Microsoft Build of OpenJDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: ${{ matrix.java }}

      - name: Build Java 8 bytecode (./mvnw install)
        run: ./mvnw -B -ntp install

  # Release archives contain Java 8 bytecode built with OpenJDK 25. They are
  # portable JVM packages, not Windows-specific binaries.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Microsoft Build of OpenJDK 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "25"

      - name: Build (./mvnw install, from repository root)
        run: ./mvnw -B -ntp install

      - name: Verify release tag matches project version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          project_version="$(./mvnw -q -N org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=project.version -DforceStdout)"
          test "$release_version" = "$project_version"

      - name: Collect release artifacts and compute checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          mkdir -p release-artifacts
          cp "l2jfree-login/target/l2jfree-login-${release_version}-dist.zip" release-artifacts/
          cp "l2jfree-core/target/l2jfree-core-${release_version}-dist.zip" release-artifacts/
          cp "l2jfree-datapack/target/l2jfree-datapack-${release_version}-dist.zip" release-artifacts/
          ( cd release-artifacts && sha256sum *.zip > SHA256SUMS.txt )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release-artifacts/* \
            --title "${{ github.ref_name }}" \
            --prerelease \
            --notes "Portable JVM build with Java 8 bytecode, built by the Microsoft OpenJDK 25 CI package job. This prerelease requires Windows 10 runtime and deployment-image qualification before stable promotion. Not a platform-specific/Windows binary. See the 2026 Q4 Upgrade plan and SHA256SUMS.txt."
