name: build

# Bounded build/toolchain verification only (l2go ADR-0002 D2) — this workflow
# never touches game logic, only confirms the pack still compiles on the
# project's target JDK (l2go ADR-0006). CI is the source of truth for "does
# it build": see l2go ADR-0002/ADR-0005 — this is deliberately never built or
# verified on the maintainer's own local machine.

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # maven-jgit-buildnumber-plugin reads git history; a shallow clone
          # produces a wrong/missing build number, not a build failure, but
          # full history keeps the number meaningful.
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Build (./mvnw install, from repository root)
        run: ./mvnw -B -ntp install

  # Publishes a portable JVM build (JDK 11 bytecode) as a GitHub Release when a
  # `v*` tag is pushed. This is NOT a platform-specific/Windows binary — see
  # l2go ADR-0010. Never uploaded by hand; CI is the only path to a release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Build (./mvnw install, from repository root)
        run: ./mvnw -B -ntp install

      - name: Collect release artifacts and compute checksums
        run: |
          mkdir -p release-artifacts
          cp l2jfree-login/target/l2jfree-login-1.3.0-dist.zip release-artifacts/
          cp l2jfree-core/target/l2jfree-core-1.3.0-dist.zip release-artifacts/
          cp l2jfree-datapack/target/l2jfree-datapack-1.3.0-dist.zip release-artifacts/
          ( cd release-artifacts && sha256sum *.zip > SHA256SUMS.txt )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release-artifacts/* \
            --title "${{ github.ref_name }}" \
            --notes "Portable JVM build (JDK 11 bytecode), verified by CI. Not a platform-specific/Windows binary — runs on any OS with a matching JRE. Build tooling only; no game logic changed from upstream. See README.md for what changed and why, and SHA256SUMS.txt to verify these files."
