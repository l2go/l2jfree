# The stand profile, layered over deploy/compose.yaml. Run from deploy/:
#
#   docker compose -f compose.yaml -f stand/simulator/compose.yaml up -d
#
# A stand is a server that an external simulator drives and observes. The shipped
# configuration stays unchanged: the overrides are files of the operator
# directory (ADR-0011); see stand/simulator/README.md.
services:
  db:
    volumes:
      - ./stand/simulator:/opt/stand:ro
    ports:
      # For the read-only role simulator_ro; bind to the address the simulator connects from.
      - "${STAND_DB_BIND:-127.0.0.1}:5432:5432"

  server:
    volumes:
      # Replaces the operator volume of compose.yaml with the files of the stand.
      - ./stand/simulator/config:/var/lib/l2jfree/config:ro
    environment:
      # Every start moves the previous item log to log/item/runs/<UTC time>.
      L2JFREE_ITEM_LOG: rotate
      # Log time stamps carry no year and no zone; the simulator reads them as UTC. This replaces the default
      # L2JFREE_JAVA_OPTS of compose.yaml, so the heap and the collector are named again.
      L2JFREE_JAVA_OPTS: -Xms1g -Xmx3g -XX:+UseG1GC -Duser.timezone=UTC
