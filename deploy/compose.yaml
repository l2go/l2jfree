# Platform 3.0 delivery: `docker compose up -d --wait` is the whole installation
# (ADR-0002). The stack runs on Docker Desktop (Windows), Colima (macOS), and
# Docker Engine (Linux).
#
# The login service runs the LoginServer against PostgreSQL 18. The world on
# port 7777 arrives with the rest of milestone M2, so the port is published but
# nothing listens on it yet.

name: l2jfree

x-server: &server
  image: ${L2JFREE_IMAGE:-ghcr.io/l2go/l2jfree:edge}
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # Creates the database passwords once, in a volume shared with the database.
  secrets:
    <<: *server
    entrypoint: ["/opt/l2jfree/bin/init-secrets"]
    volumes:
      - secrets:/var/lib/l2jfree/secrets
    restart: "no"

  db:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_DB: l2jfree
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/l2jfree-secrets/postgres_password
    volumes:
      - dbdata:/var/lib/postgresql
      - secrets:/run/l2jfree-secrets:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    depends_on:
      secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d l2jfree"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    restart: unless-stopped

  login:
    <<: *server
    depends_on:
      db:
        condition: service_healthy
    environment:
      L2JFREE_DB_URL: jdbc:postgresql://db:5432/l2jfree
      L2JFREE_DB_USER: l2jfree_login
      L2JFREE_DB_PASSWORD_FILE: /var/lib/l2jfree/secrets/login_password
    ports:
      - "${L2JFREE_BIND:-0.0.0.0}:2106:2106"
      - "${L2JFREE_BIND:-0.0.0.0}:7777:7777"
    volumes:
      - secrets:/var/lib/l2jfree/secrets:ro
      - logs:/var/lib/l2jfree/log
    tmpfs:
      - /run/l2jfree:uid=10001,gid=10001,mode=0700
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/2106"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  secrets:
  dbdata:
  logs:
